# version: "3.9"

################################################################################

# Fetch Robotics Fetch platform overlay for OpenRoSDE.
# Passes Fetch-specific environment variables to the container.

################################################################################

services:
  openrosde:
    environment:
      # No platform-specific environment variables for Fetch at this time.
      - OPENROSDE_ROBOT_PLATFORM=${OPENROSDE_ROBOT_PLATFORM}
